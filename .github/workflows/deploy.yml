name: CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 直接进入server目录安装依赖
      - name: Install dependencies
        run: npm install --prefix ./server

      # 直接在server目录运行测试脚本
      - name: Run tests
        run: npm test --prefix ./server