name: CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server  # 强制所有命令在 server 目录执行
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install all dependencies (including dev)
        run: npm install

      - name: Verify mocha is installed
        run: npx mocha --version

      - name: Run tests
        run: npm test